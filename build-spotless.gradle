def conditionalDatagenPackMetadataProviderRule = { spec ->
    spec.custom 'DatagenPackMetadataProviderRule', { String text ->
        if (!text.contains("class DatagenPackMetadataProvider")) {
            return text
        }
        return text
            .replaceAll(/(?m)^([ \t]*)private static final List<String> FILTERED_VANILLA_ADVANCEMENTS = List\.of\(([^)]*)\);/) { Object[] args ->
                def indent = args[1]
                def itemIndent = indent + "    "
                def items = args[2].findAll(/"[^"]*"/)
                return indent + "private static final List<String> FILTERED_VANILLA_ADVANCEMENTS = List.of(\n" + items.collect { itemIndent + it }.join(",\n") + "\n" + indent + ");"
            }
            .replaceAll(/(?m)^([ \t]*)private static final List<String> FILTERED_VANILLA_RECIPES = List\.of\(([^)]*)\);/) { Object[] args ->
                def indent = args[1]
                def itemIndent = indent + "    "
                def items = args[2].findAll(/"[^"]*"/)
                return indent + "private static final List<String> FILTERED_VANILLA_RECIPES = List.of(\n" + items.collect { itemIndent + it }.join(",\n") + "\n" + indent + ");"
            }
    }
}

def conditionalDatagenRecipeBuilderRule = { spec ->
    spec.custom 'DatagenRecipeBuilderRule', { String text ->
        if (!text.contains("class DatagenRecipeBuilder") && !text.contains("class CreateRecipeBuilder")) {
            return text
        }
        return text
            .replaceAll(/(?s)([ \t]*)(shaped|shapeless)\b(.*?);/) { Object[] args ->
                def indent = args[1]
                def rawBody = args[2] + args[3]
                def cleanSingleLine = rawBody.replaceAll(/[\r\n]+[ \t]*/, " ")
                def formatted = cleanSingleLine.replaceAll(/\s*\.(group|define|pattern|requires|unlockedBy|save|showNotification)\(/, '\n' + indent + indent1 + '.$1(')
                return indent + formatted + ";"
            }
            .replaceAll(/(?s)([ \t]*)(SimpleCookingRecipeBuilder\.generic\(.*?);/) { Object[] args ->
                def indent = args[1]
                def statement = args[2]
                def formatted = statement.replaceAll(/\s*\.(group|unlockedBy|save)\(/, '\n' + indent + indent1 + '.$1(')
                return indent + formatted + ";"
            }
            .replaceAll(/(?s)([ \t]*)(SandpaperRecipeBuilder\.polishing\(.*?);/) { Object[] args ->
                def indent = args[1]
                def statement = args[2]
                def formatted = statement.replaceAll(/\s*\.(unlockedBy|save)\(/, '\n' + indent + indent1 + '.$1(')
                return indent + formatted + ";"
            }
    }
}

def conditionalDatagenTrimItemsAtlasBuilderRule = { spec ->
    spec.custom 'DatagenTrimItemsAtlasBuilderRule', { String text ->
        if (!text.contains("class DatagenTrimItemsAtlasBuilder")) {
            return text
        }
        return text
            .replaceAll(/(?m)^([ \t]*)private static final String\[\] ITEM_TEXTURES = \{([^{}\r\n]*)\};/, { args ->
                def indent = args[1]
                def items = args[2].split(/\s*,\s*/).toList()
                def itemIndent = indent + indent1
                def formattedItems = items.collect { "${itemIndent}${it}" }.join(",\n")
                return "${indent}private static final String[] ITEM_TEXTURES = {\n${formattedItems}\n${indent}};"
            }
            )
    }
}

def conditionalBlockDataRule = { spec ->
    spec.custom 'BlockDataRule', { String text ->
        if (!text.contains("public record BlockData")) {
            return text
        }
        return text
            .replaceAll(/(?s)([ \t]*)(public static final List<BlockData> \w+\s*=\s*List\.of\()(.*?)(\);)/) { Object[] args ->
                def baseIndent = args[1]
                def prefix = args[2]
                def rawBody = args[3]
                def suffix = args[4]
                def items = rawBody.split(/(?<=^|\G|\)),\s*(?=new BlockData)/)
                def formattedItems = items.collect { it.trim() }.findAll { !it.isEmpty() }.join(",\n" + baseIndent + indent1)
                return baseIndent + prefix + "\n" + baseIndent + indent1 + formattedItems + "\n" + baseIndent + suffix
            }
    }
}

def conditionalGenerateSourceCode = { spec ->
    spec.custom 'conditionalGenerateSourceCodeRule', { String text ->
        if (!text.contains("class GenerateKeyBlockItems") && !text.contains("class GenerateRegisterBlockEntityType") && !text.contains("class GenerateRegisterBlocks") && !text.contains("class GenerateRegisterCreativeModeTabs")) {
            return text
        }
        return text
            .replaceAll(/(?m)^([ \t]*)(.*)$/) { Object[] args ->
                def indent = args[1]
                def line = args[2]
                def appendCount = line.findAll(/\.append\(/).size()
                if (appendCount < 2) {
                    return args[0]
                }
                def formattedLine = line.replaceAll(/[ \t]*\.append\(/) {
                    "\n${indent}${indent1}.append("
                }
                return "${indent}${formattedLine}"
            }
    }
}

def conditionalRegisterBlocksRule = { spec ->
    spec.custom 'RegisterBlocksRule', { String text ->
        if (!text.contains("class RegisterBlocks")) {
            return text
        }
        return text
            .replaceAll(/(?s)([ \t]*)(public static final Block)\b(.*?);/) { Object[] args ->
                def indent = args[1]
                def rawBody = args[2] + args[3]
                def cleanSingleLine = rawBody.replaceAll(/[\r\n]+[ \t]*/, " ")
                def spitLines = cleanSingleLine.replaceAll(/(?=\bKeyBlockItems\b|BlockBehaviour\.Properties)/, '\n' + indent + indent1)
                def formatted = spitLines.replaceAll(/\s*\.(emissiveRendering|forceSolidOff|friction|ignitedByLava|instabreak|instrument|isRedstoneConductor|isValidSpawn|lightLevel|mapColor|noCollision|noLootTable|noOcclusion|pushReaction|randomTicks|requiresCorrectToolForDrops|sound|strength)\(/, '\n' + indent + indent2 + '.$1(')
                return indent + formatted + ";"
            }
    }
}

def conditionalRegisterItemsRule = { spec ->
    spec.custom 'RegisterItemsRule', { String text ->
        if (!text.contains("class RegisterItems")) {
            return text
        }
        return text
            .replaceAll(/(?s)([ \t]*)(public static final Item)\b(.*?);/) { Object[] args ->
                def indent = args[1]
                def rawBody = args[2] + args[3]
                def cleanSingleLine = rawBody.replaceAll(/[\r\n]+[ \t]*/, " ")
                def spitLines = cleanSingleLine.replaceAll(/(?=\bKeyItems\b|\bKeyBlockItems\b|new Item\.Properties\(\))/, '\n' + indent + indent1)
                def formatted = spitLines.replaceAll(/\s*\.(component|delayedComponent|durability|enchantable|fireResistant|food|humanoidArmor|rarity|repairable|stacksTo|tool|trimMaterial|useBlockDescriptionPrefix)\(/, '\n' + indent + indent2 + '.$1(')
                return indent + formatted + ";"
            }
    }
}

def conditionalRegisterConfiguredFeaturesRule = { spec ->
    spec.custom 'RegisterConfiguredFeaturesRule', { String text ->
        if (!text.contains("class RegisterConfiguredFeatures")) {
            return text
        }
        text
            .replaceAll(/(?m)^([ \t]*)(FeatureUtils\.register\()(.*?)(\);)/) { Object[] args ->
                def baseIndent = args[1]
                def methodSignature = args[2]
                def rawParams = args[3].replaceAll(/\s*\n\s*/, " ")
                def suffix = args[4]
                def splitParams = rawParams.split(/,(?![^\(]*\))/)
                def formattedParams = splitParams.collect { it.trim() }.join(",\n" + baseIndent + indent1)
                return baseIndent + methodSignature + "\n" + baseIndent + indent1 + formattedParams + suffix
            }
    }
}

