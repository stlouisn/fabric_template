}

def conditionalRecipeProviderRule = { spec ->
    spec.custom 'RecipeProviderRule', { String text ->
        if (!text.contains("class RecipeProvider") && !text.contains("class VanillaRecipeProvider")) {
            return text
        }
        return text
            .replaceAll(/(?s)([ \t]*)(shaped|shapeless)\b(.*?);/) { Object[] args ->
                def indent = args[1]
                def rawBody = args[2] + args[3]
                def cleanSingleLine = rawBody.replaceAll(/[\r\n]+[ \t]*/, " ")
                def formatted = cleanSingleLine.replaceAll(/\s*\.(pattern|define|unlockedBy|save|group|showNotification)\(/, '\n' + indent + indent1 + '.$1(')
                return indent + formatted + ";"
            }
    }
}

// ------------------------------------------------------------------------------------------

spotless {
    java {
        target 'src/main/**/*.java'
        targetExclude(
            'src/main/**/datagen/data/BlockType.java',
            'src/main/**/datagen/data/BlockVariant.java'
        )
        applyPreConfig(delegate)
        conditionalMixinRule(delegate)
        conditionalContentBlockRule(delegate)
        conditionalDatagenAdvancementBuilderRule(delegate)
        conditionalDatagenAdvancementProviderRule(delegate)
        conditionalDatagenBlockTagProviderRule(delegate)
        conditionalDatagenItemTagBuilderRule(delegate)
        conditionalDatagenItemTagProviderRule(delegate)
        conditionalDatagenPackMetadataProviderRule(delegate)
        conditionalDatagenRecipeBuilderRule(delegate)
        conditionalDatagenTrimItemsAtlasBuilderRule(delegate)
        conditionalBlockDataRule(delegate)
        conditionalGenerateSourceCode(delegate)
        conditionalRegisterBlocksRule(delegate)
        conditionalRegisterItemsRule(delegate)
        conditionalRegisterConfiguredFeaturesRule(delegate)
        conditionalRegisterPlacedFeaturesRule(delegate)
        conditionalRecipeProviderRule(delegate)
        applyPostConfig(delegate)
    }
}
