//file:noinspection GroovyAssignabilityCheck
//file:noinspection GroovyUnusedAssignment
//file:noinspection GrUnresolvedAccess

// ------------------------------------------------------------------------------------------

def indentDepth = { depth -> '    ' * depth }
def indent1 = indentDepth(1)
def indent2 = indentDepth(2)
def indent3 = indentDepth(3)
def indent4 = indentDepth(4)
def indent5 = indentDepth(5)
def indent6 = indentDepth(6)
def indent7 = indentDepth(7)
def indent8 = indentDepth(8)

// ------------------------------------------------------------------------------------------

def applyPreConfig = { spec ->
    spec.eclipse().configFile('.java-style.xml')
    spec.removeUnusedImports()
    spec.importOrder()
    spec.formatAnnotations()
}

def applyPostConfig = { spec ->
    spec.custom 'linebreakNullabilityAnnotations', { text ->
        text.replaceAll(/(?m)^(\s*)(@(?>Nullable|NonNull))\s+(public|protected|private)\b/, '$1$2\n$1$3')
            .replaceAll(/(?m)^(\s*)(@(?>Nullable|NonNull))\s*\n\s*\n(\s*(?:public|protected|private)\b)/, '$1$2\n$3')
    }
    spec.leadingTabsToSpaces(4)
    spec.trimTrailingWhitespace()
    spec.endWithNewline()
}

// ------------------------------------------------------------------------------------------

def conditionalMixinRule = { spec ->
    spec.custom 'MixinRule', { text ->
        if (!text.contains("@Mixin")) {
            return text
        }
        return text
            .replaceAll(/(?m)(?<!@IfModLoaded\(|@Local\(|@Mixin\()(args|argsOnly|at|cancellable|index|method|name|ordinal|shift|slice|target|value)\s*=\s{1,}(?!\=)/, '\n' + indent2 + '$1 = ')
            .replaceAll(/(?m)    (at = @At\()/, indent1 + '$1')
            .replaceAll(/(?m)    (args|argsOnly|name|opcode|ordinal|shift|target|value) = /, indent2 + '$1 = ')
            .replaceAll(/@Unique\s+(private|protected|public)/, '@Unique\n' + indent1 + '$1')
    }
}

def conditionalLambdaLineBreakRule = { spec ->
    spec.custom 'LambdaLineBreakRule', { text ->
        if (!text.contains("class BiomeModifiers") && !text.contains("class RegisterItems")) {
            return text
        }
        return text
            .replaceAll(
                /(?m)^([ \t]*)(.*?\b([a-zA-Z0-9_$%]+|\([^)]+\)))[ \t]*->(?!\s*\{)[ \t]*/,
                { Object[] args ->
                    def indent = args[1]
                    def preLambda = args[2]
                    return "${indent}${preLambda}\n${indent}    -> "
                }
            )
            .replaceAll(
                /(?m)^([ \t]*)(.*?)[ \t]*\(\)\s*->(?!\s*\{)[ \t]*/,
                { Object[] args ->
                    def indent = args[1]
                    def preLambda = args[2]
                    return "${indent}${preLambda}\n${indent}    () -> "
                }
            )
    }
}

def conditionalDatagenAdvancementProviderRule = { spec ->
    spec.custom 'DatagenAdvancementProviderRule', { String text ->
        if (!text.contains("class DatagenAdvancementProvider")) {
            return text
        }
        return text.replaceAll(/Advancement\.Builder\.advancement\(\)(.*?\.save\(.*?\);)/, { Object[] args ->
            def chain = args[1]
            def formatted = chain
                .replaceAll(/\.parent\(/, "\n${indent3}.parent(")
                .replaceAll(/\.display\(/, "\n${indent3}.display(")
                .replaceAll(/\.addCriterion\(/, "\n${indent3}.addCriterion(")
                .replaceAll(/\.save\(/, "\n${indent3}.save(")
            return "Advancement.Builder.advancement()" + formatted
        })
    }
}

def conditionalDatagenBlockTagProviderRule = { spec ->
    spec.custom 'DatagenBlockTagProviderRule', { String text ->
        if (!text.contains("class DatagenBlockTagProvider")) {
            return text
        }
        return text
            .replaceAll(/(?m)\)\s*\.addTag\(/, ')\n' + indent3 + '.addTag(')
            .replaceAll(/(?m)\s*KeyBlocks\./, '\n' + indent3 + 'KeyBlocks.')
            .replaceAll(/(?m)\s*KeyBlockItems\./, '\n' + indent3 + 'KeyBlockItems.')
    }
}

def conditionalRegisterItemsRule = { spec ->
    spec.custom 'RegisterItemsRule', { String text ->
        if (!text.contains("class RegisterItems")) {
            return text
        }
        return text.replaceAll(/(?s)([ \t]*)(public static final Item)\b(.*?);/) { Object[] args ->
            def indent = args[1]
            def rawBody = args[2] + args[3]
            def cleanSingleLine = rawBody.replaceAll(/[\r\n]+[ \t]*/, " ")
            def formatted = cleanSingleLine.replaceAll(/\s*\.(component|delayedComponent|durability|enchantable|fireResistant|food|humanoidArmor|rarity|repairable|tool)\(/, '\n' + indent + indent1 + '.$1(')
            return indent + formatted + ";"
        }
    }
}

def conditionalRegisterConfiguredFeaturesRule = { spec ->
    spec.custom 'RegisterConfiguredFeaturesRule', { String text ->
        if (!text.contains("class RegisterConfiguredFeatures")) {
            return text
        }
        text.replaceAll(/(?m)^([ \t]*)(FeatureUtils\.register\()(.*?)(\);)/) { Object[] args ->
            def baseIndent = args[1]
            def methodSignature = args[2]
            def rawParams = args[3].replaceAll(/\s*\n\s*/, " ")
            def suffix = args[4]
            def splitParams = rawParams.split(/,(?![^\(]*\))/)
            def formattedParams = splitParams.collect { it.trim() }.join(",\n" + baseIndent + indent1)
            return baseIndent + methodSignature + "\n" + baseIndent + indent1 + formattedParams + suffix
        }
    }
}

def conditionalRegisterPlacedFeaturesRule = { spec ->
    spec.custom 'RegisterPlacedFeaturesRule', { String text ->
        if (!text.contains("class RegisterPlacedFeatures")) {
            return text
        }
        text.replaceAll(/(?m)^([ \t]*)(PlacementUtils\.register\()(.*?)(\);)/) { Object[] args ->
            def baseIndent = args[1]
            def methodSignature = args[2]
            def rawParams = args[3].replaceAll(/\s*\n\s*/, " ")
            def suffix = args[4]
            def splitParams = rawParams.split(/,(?![^\(]*\))/)
            def formattedParams = splitParams.collect { it.trim() }.join(",\n" + baseIndent + indent1)
            return baseIndent + methodSignature + "\n" + baseIndent + indent1 + formattedParams + suffix
        }
    }
}

def conditionalRecipeProviderRule = { spec ->
    spec.custom 'RecipeProviderRule', { String text ->
        if (!text.contains("class RecipeProvider") && !text.contains("class VanillaRecipeProvider")) {
            return text
        }
        return text.replaceAll(/(?s)([ \t]*)(shaped|shapeless)\b(.*?);/) { Object[] args ->
            def indent = args[1]
            def rawBody = args[2] + args[3]
            def cleanSingleLine = rawBody.replaceAll(/[\r\n]+[ \t]*/, " ")
            def formatted = cleanSingleLine.replaceAll(/\s*\.(pattern|define|unlockedBy|save|group|showNotification)\(/, '\n' + indent + indent1 + '.$1(')
            return indent + formatted + ";"
        }
    }
}

// ------------------------------------------------------------------------------------------

spotless {
    java {
        target 'src/main/**/*.java'
        applyPreConfig(delegate)
        conditionalMixinRule(delegate)
        conditionalLambdaLineBreakRule(delegate)
        conditionalDatagenAdvancementProviderRule(delegate)
        conditionalDatagenBlockTagProviderRule(delegate)
        conditionalRegisterItemsRule(delegate)
        conditionalRegisterConfiguredFeaturesRule(delegate)
        conditionalRegisterPlacedFeaturesRule(delegate)
        conditionalRecipeProviderRule(delegate)
        applyPostConfig(delegate)
    }
}
