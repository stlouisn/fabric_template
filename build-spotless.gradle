//file:noinspection GroovyAssignabilityCheck
//file:noinspection GroovyUnusedAssignment
//file:noinspection GrUnresolvedAccess

// ------------------------------------------------------------------------------------------

def indentDepth = { depth -> '    ' * depth }
def indent1 = indentDepth(1)
def indent2 = indentDepth(2)
def indent3 = indentDepth(3)
def indent4 = indentDepth(4)
def indent5 = indentDepth(5)
def indent6 = indentDepth(6)
def indent7 = indentDepth(7)
def indent8 = indentDepth(8)

// ------------------------------------------------------------------------------------------

def applyPreConfig = { spec ->
    spec.eclipse().configFile('.java-style.xml')
    spec.removeUnusedImports()
    spec.importOrder()
    spec.formatAnnotations()
}

def applyPostConfig = { spec ->
    spec.custom 'linebreakNullabilityAnnotations', { text ->
        text
            .replaceAll(/(?m)^(\s*)(@(?>Nullable|NonNull))\s+(default|private|protected|public)\b/, '$1$2\n$1$3')
            .replaceAll(/(?m)^(\s*)(@(?>Nullable|NonNull))\s*\n\s*\n(\s*(?:default|private|protected|public)\b)/, '$1$2\n$3')
    }
    spec.custom 'formatClassArrayDeclarations', { String text ->
        text
            .replaceAll(/(?s)(?m)^([ \t]*)(((?:(?:private|protected|public)\s+)?static\s+final\s+Class<\?>\[\]\s+\w+\s*=\s*\{)(.*?)(\}\s*;))/) { Object[] args ->
                def baseIndent = args[1]
                def declaration = args[2]
                def prefix = args[3]
                def rawEntries = args[4]
                def suffix = args[5]
                def entries = rawEntries
                    .split(/\s*,\s*/)
                    .collect { it.trim() }
                    .findAll { !it.isEmpty() }
                if (entries.isEmpty() || !entries.every { it ==~ /[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*\.class/ }) {
                    return declaration
                }
                return baseIndent + prefix + "\n" + entries.collect { baseIndent + indent1 + it }.join(",\n") + "\n" + baseIndent + suffix
            }
    }
    spec.leadingTabsToSpaces(4)
    spec.trimTrailingWhitespace()
    spec.endWithNewline()
}

// ------------------------------------------------------------------------------------------

def conditionalMixinRule = { spec ->
    spec.custom 'MixinRule', { text ->
        if (!text.contains("@Mixin")) {
            return text
        }
        return text
            .replaceAll(/(?m)(?<!@IfModLoaded\(|@Local\(|@Mixin\()(args|argsOnly|at|cancellable|index|method|name|ordinal|shift|slice|target|value)\s*=\s{1,}(?!\=)/, '\n' + indent2 + '$1 = ')
            .replaceAll(/(?m)    (at = @At\()/, indent1 + '$1')
            .replaceAll(/(?m)    (args|argsOnly|name|opcode|ordinal|shift|target|value) = /, indent2 + '$1 = ')
            .replaceAll(/(?m)^([ \t]*)@Nullable[ \t]+(@Shadow(?:\([^)]*\))?)/, '$1@Nullable\n$1$2')
            .replaceAll(/(?m)^([ \t]*)@Unique[ \t]+(@(?:Nullable|NonNull))[ \t]+(default|private|protected|public)\b/, '$1@Unique\n$1$2\n$1$3')
            .replaceAll(/@Unique\s+(default|private|protected|public)/, '@Unique\n' + indent1 + '$1')
    }
}

def conditionalContentBlockRule = { spec ->
    spec.custom 'ContentBlockRule', { String text ->
        if (!(text =~ /(?m)^package\s+(?:dev|com)\.[A-Za-z0-9_]+(?:\.[A-Za-z0-9_]+)*\.content\.block(?:\.[A-Za-z0-9_]+)*\s*;/)) {
            return text
        }
        return text
            .replaceAll(/(?m)^([ \t]*)(.*)$/) { Object[] args ->
                def indent = args[1]
                def line = args[2]
                if (line.trim().startsWith('.setValue(')) {
                    return args[0]
                }
                if (line.contains('?')) {
                    return args[0]
                }
                def setValueCount = line.findAll(/\.setValue\(/).size()
                if (setValueCount < 2) {
                    return args[0]
                }
                def formattedLine = line.replaceAll(/(?<!resultState)[ \t]*\.setValue\(/) {
                    "\n${indent}${indent1}.setValue("
                }
                return "${indent}${formattedLine}"
            }
    }
}

def conditionalDatagenAdvancementBuilderRule = { spec ->
    spec.custom 'DatagenAdvancementBuilderRule', { String text ->
        if (!text.contains("class DatagenAdvancementBuilder")) {
            return text
        }
        return text
            .replaceAll(/Advancement\.Builder\.advancement\(\)(.*?\.save\(.*?\);)/, { Object[] args ->
                def chain = args[1]
                def formatted = chain
                    .replaceAll(/\.parent\(/, "\n${indent4}.parent(")
                    .replaceAll(/\.display\(/, "\n${indent4}.display(")
                    .replaceAll(/\.addCriterion\(/, "\n${indent4}.addCriterion(")
                    .replaceAll(/\.save\(/, "\n${indent4}.save(")
                return "Advancement.Builder.advancement()" + formatted
            })
    }
}

def conditionalDatagenAdvancementProviderRule = { spec ->
    spec.custom 'DatagenAdvancementProviderRule', { String text ->
        if (!text.contains("class DatagenAdvancementProvider")) {
            return text
        }
        return text
            .replaceAll(/(?m)^([ \t]*)builder\.add\(([^()\r\n]*)\);/, { Object[] args ->
                def indent = args[1]
                def parameters = args[2].split(/\s*,\s*/).toList()
                def continuationIndent = indent + "    "
                def formattedParameters = parameters.collect { "${indent + indent1}${it}" }.join(",\n")
                return "${indent}builder.add(\n${formattedParameters});"
            })
    }
}

def conditionalDatagenBlockTagProviderRule = { spec ->
    spec.custom 'DatagenBlockTagProviderRule', { String text ->
        if (!text.contains("class DatagenBlockTagProvider")) {
            return text
        }
        return text
            .replaceAll(/(?m)^([ \t]*)(.*)$/) { Object[] args ->
                def indent = args[1]
                def line = args[2]
                def addTagCount = line.findAll(/\.addTag\(/).size()
                if (addTagCount < 2) {
                    return args[0]
                }
                return indent + line.replaceAll(/\)\s*\.addTag\(/, ')' + '\n' + indent + indent3 + '.addTag(')
            }
            .replaceAll(/(?m)^([ \t]*)(.*)$/) { Object[] args ->
                def indent = args[1]
                def line = args[2]
                def keyBlocksCount = line.findAll(/KeyBlocks\./).size()
                if (keyBlocksCount < 2) {
                    return args[0]
                }
                return indent + line.replaceAll(/\s*KeyBlocks\./, '\n' + indent + indent3 + 'KeyBlocks.')
            }
            .replaceAll(/(?m)^([ \t]*)(.*)$/) { Object[] args ->
                def indent = args[1]
                def line = args[2]
                def keyBlockItemsCount = line.findAll(/KeyBlockItems\./).size()
                if (keyBlockItemsCount < 2) {
                    return args[0]
                }
                return indent + line.replaceAll(/\s*KeyBlockItems\./, '\n' + indent + indent3 + 'KeyBlockItems.')
            }
    }
}

def conditionalDatagenItemTagBuilderRule = { spec ->
    spec.custom 'DatagenItemTagBuilderRule', { String text ->
        if (!text.contains("class DatagenItemTagBuilder")) {
            return text
        }
        return text
            .replaceAll(/(?s)([ \t]*)private static final Set<TagKey<Block>> IGNORED_BLOCK_TAGS = Set\.of\(\s*(.*?)\s*\);/) { Object[] args ->
                def indent = args[1]
                def entries = args[2].split(/\s*,\s*/)
                return indent + "private static final Set<TagKey<Block>> IGNORED_BLOCK_TAGS = Set.of(\n" + entries.collect { entry -> indent + "    " + entry }.join(",\n") + "\n" + indent + ");"
            }
    }
}

